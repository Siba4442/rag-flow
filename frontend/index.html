<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>RAG Flow</title>
    <script>
      // Apply the saved theme before first paint (no light flash in dark mode).
      try {
        const t = localStorage.getItem("ragflow.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app" id="app">
      <!-- ============================================================ left: rail (3 cols) -->
      <aside class="rail" id="rail" aria-label="Navigation and library">
        <header class="rail-head">
          <div class="brand"><span class="mark" aria-hidden="true">1</span><span class="brand-name">RAG Flow</span></div>
          <button class="icon-btn only-mobile" id="close-rail" type="button" aria-label="Close menu">✕</button>
        </header>

        <nav class="nav" aria-label="Views" role="tablist">
          <button class="nav-item mode" role="tab" data-mode="home" aria-selected="true">Home</button>
          <button class="nav-item mode" role="tab" data-mode="chat" aria-selected="false">Ask</button>
          <button class="nav-item mode" role="tab" data-mode="search" aria-selected="false">Search passages</button>
        </nav>

        <section class="rail-group grow" aria-labelledby="lib-title">
          <div class="group-head">
            <h2 id="lib-title">Library</h2>
            <span class="count" id="scope-hint"></span>
          </div>
          <ul class="file-list" id="file-list" aria-live="polite"></ul>
        </section>

        <section class="rail-group" aria-labelledby="threads-title">
          <div class="group-head">
            <h2 id="threads-title">Conversations</h2>
            <button class="text-btn" id="new-thread" type="button">New</button>
          </div>
          <ul class="thread-list" id="thread-list"></ul>
        </section>

        <footer class="system-card" id="system-card">
          <dl id="system-info"></dl>
          <p class="health" id="health"><span class="dot" aria-hidden="true"></span><span>Checking…</span></p>
          <div class="rail-foot">
            <button class="text-btn" id="open-settings" type="button">Settings</button>
            <div class="segmented" role="radiogroup" aria-label="Theme">
              <button type="button" role="radio" data-theme-choice="light">Light</button>
              <button type="button" role="radio" data-theme-choice="dark">Dark</button>
              <button type="button" role="radio" data-theme-choice="system">Auto</button>
            </div>
          </div>
        </footer>
      </aside>

      <!-- ============================================================ centre (6 cols) -->
      <main class="desk">
        <div class="desk-bar">
          <button class="icon-btn only-mobile" id="open-rail" type="button" aria-label="Open menu">☰</button>
          <h1 class="view-title" id="view-title">Home</h1>
          <span class="status" id="status" role="status"></span>
        </div>

        <section class="page" id="page"></section>

        <form class="composer" id="composer" autocomplete="off">
          <label class="sr-only" for="prompt">Your question</label>
          <textarea id="prompt" rows="1" placeholder="Ask about the selected files"></textarea>
          <button class="btn-primary" id="send" type="submit">Ask</button>
        </form>
      </main>

      <!-- ============================================================ right: evidence (3 cols) -->
      <aside class="evidence" aria-label="Evidence">
        <div class="evidence-body" id="margin"></div>
        <label class="dropzone" id="dropzone">
          <input type="file" id="file-input" multiple hidden />
          <strong>Add files</strong>
          <span>Drop here or <u>browse</u>. PDF, Word, Excel, PowerPoint, Markdown, CSV, code.</span>
        </label>
      </aside>
    </div>

    <dialog class="sheet" id="settings">
      <form method="dialog" id="settings-form">
        <h2>Connection settings</h2>
        <p class="hint">Stored in this browser only.</p>
        <label>API address
          <input name="baseUrl" placeholder="Same server (default)" />
        </label>
        <label>Access token (JWT)
          <input name="token" type="password" placeholder="Leave empty when auth is off" />
        </label>
        <label>Entity id
          <input name="entityId" placeholder="Optional, e.g. an agent id" />
        </label>
        <div class="sheet-actions">
          <button value="cancel" class="text-btn">Cancel</button>
          <button value="save" class="btn-primary">Save</button>
        </div>
      </form>
    </dialog>

    <dialog class="sheet wide" id="reader">
      <form method="dialog">
        <header class="reader-head">
          <h2 id="reader-title"></h2>
          <button class="icon-btn" value="close" aria-label="Close">✕</button>
        </header>
        <article class="reader-body" id="reader-body"></article>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
