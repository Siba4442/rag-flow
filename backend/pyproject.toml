[project]
name = "ragflow"
version = "0.1.0"
description = "RAG Flow: self-hosted document Q&A with cited answers, built on LangGraph"
readme = "README.md"
authors = [{ name = "Siba" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "chardet>=7.6.0",
    "docx2txt>=0.9",
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-postgres>=0.0.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "markdown>=3.11",
    "networkx>=3.7",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "sse-starlette>=3.5.0",
    "tenacity>=9.1.4",
    "unstructured>=0.27.10",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
]

[project.scripts]
ragflow = "ragflow.main:run"

[project.optional-dependencies]
openai = [
    "langchain-openai>=1.6.7",
]
anthropic = [
    "langchain-anthropic>=1.7.5",
]
ollama = [
    "langchain-ollama>=1.1.0",
]
google = [
    "langchain-google-genai>=4.4.0",
]
bedrock = [
    "boto3>=1.43.108",
    "langchain-aws>=1.8.0",
]
pinecone = [
    "langchain-pinecone>=0.2.13",
]
chroma = [
    "langchain-chroma>=1.1.0",
]
mongo = [
    "langchain-mongodb>=0.12.1",
    "pymongo>=4.18.2",
]
llamaparse = [
    "llama-cloud>=2.16.0",
]
docling = [
    "langchain-docling>=3.0.0",
]
huggingface = [
    "langchain-huggingface>=1.2.2",
    "sentence-transformers>=6.1.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "ANN", "C4", "PT", "RET"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["ragflow"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["ragflow"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "chardet.*",
    "docx2txt.*",
    "unstructured.*",
    "pinecone.*",
    "chromadb.*",
    "llama_cloud.*",
    "docling.*",
    "langchain_docling.*",
    "langchain_huggingface.*",
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# --------------------------------------------------------------------------- pyright (LSP)
[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: needs Docker (testcontainers)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "testcontainers[postgres]>=4.15.0",
    "types-aiofiles>=25.1.0.20260518",
]
